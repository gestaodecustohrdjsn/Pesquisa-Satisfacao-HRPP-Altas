<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0097B2" />
  <meta name="description" content="Pesquisa de Satisfação - Altas Hospitalares" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>Pesquisa de Satisfação - Altas Hospitalares</title>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <img
        src="./assets/images/logo_hospital.png"
        alt="Logo do hospital"
        class="logo"
        onerror="this.style.display='none'"
      />
      <div>
        <p class="eyebrow">PESQUISA DE SATISFAÇÃO</p>
        <h1>Altas Hospitalares</h1>
      </div>
    </header>

    <section class="status-bar" aria-live="polite">
      <span id="statusConexao" class="status-pill">Verificando conexão…</span>
      <span id="statusFila" class="status-pill subtle">0 pendente(s)</span>
    </section>

    <section id="tela" class="screen" aria-live="polite"></section>

    <footer class="app-footer">
      <button id="btnVoltar" class="btn-link hidden" type="button">← Voltar</button>
    </footer>
  </main>

  <script src="./js/config.js"></script>
  <script src="./js/storage.js"></script>
  <script src="./js/sync.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
